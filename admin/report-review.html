<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مراجعة البلاغ | لوحة تحكم وين الخدمة</title>
<link rel="stylesheet" href="../الاساسية/css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="brand"><span class="pin">📍</span> وين الخدمة</div>
    <nav class="admin-nav">
      <a href="index.html" data-page="index.html"><span class="ic">🏠</span> نظرة عامة</a>
      <a href="reports.html" data-page="reports.html"><span class="ic">🚩</span> البلاغات <span class="count" data-nav-count="reports">0</span></a>
      <a href="service-requests.html" data-page="service-requests.html"><span class="ic">📥</span> طلبات الخدمات <span class="count" data-nav-count="requests">0</span></a>
      <a href="#" data-soon><span class="ic">🏷️</span> الخدمات</a>
      <a href="#" data-soon><span class="ic">👥</span> المستخدمون</a>
      <a href="#" data-soon><span class="ic">🔖</span> التصنيفات</a>
      <a href="#" data-soon><span class="ic">🛡️</span> المشرفون والصلاحيات</a>
      <div class="nav-label">النظام</div>
      <a href="#" data-soon><span class="ic">📈</span> التحليلات</a>
      <a href="#" data-soon><span class="ic">🔔</span> الإشعارات</a>
      <a href="#" data-soon><span class="ic">🕘</span> سجل النشاط</a>
      <a href="#" data-soon><span class="ic">⚙️</span> الإعدادات</a>
    </nav>
    <div class="foot">
      <img src="logo2.png" alt="">
      <div class="who"><b data-admin-name>—</b><span data-admin-role>—</span></div>
      <button data-admin-logout title="تسجيل الخروج">⏻</button>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-topbar">
      <div class="admin-search">
        <input type="text" placeholder="ابحث...">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </div>
      <div class="spacer"></div>
      <div class="top-actions">
        <button class="icon-btn" title="الإشعارات">🔔</button>
        <a href="../الاساسية/report.html" class="btn btn-primary btn-sm">+ إضافة خدمة</a>
      </div>
    </header>

    <main class="admin-content" id="content">
      <div class="breadcrumb"><a href="reports.html">البلاغات</a> ‹ <span id="bcId">...</span></div>
      <div id="reviewRoot"></div>
    </main>
  </div>
</div>

<script src="../win-db.js"></script>
<script src="js/admin.js"></script>
<script>
  if (AdminUI.requireAdminAuth()) {
    AdminUI.initSidebar();
    AdminUI.initLogout();
    document.querySelectorAll('[data-soon]').forEach(function (a) {
      a.addEventListener('click', function (e) { e.preventDefault(); AdminUI.showToast('هذه الصفحة قيد التطوير 🚧'); });
    });

    var id = new URLSearchParams(location.search).get('id');
    var report = id ? WinDB.getIssueReport(id) : null;

    if (!report) {
      document.getElementById('reviewRoot').innerHTML = '<div class="card"><div class="empty-state">لم يتم العثور على هذا البلاغ. <a href="reports.html">العودة لقائمة البلاغات</a></div></div>';
    } else {
      document.getElementById('bcId').textContent = 'بلاغ #' + report.id;
      var svcStats = AdminUI.getMergedServiceStats().find(function (s) { return s.id === report.serviceId; });
      var currentStatusLabel = svcStats ? ({ open: 'متوفر ومفتوح', busy: 'مزدحم جداً', closed: 'مغلق حالياً' })[svcStats.status] : 'غير معروفة';
      var currentStatusColor = svcStats ? AdminUI.STATUS_COLORS[svcStats.status] : '#9aa1a9';

      document.getElementById('reviewRoot').innerHTML =
        '<h1 style="font-size:20px;font-weight:900;margin-bottom:2px;">مراجعة البلاغ</h1>' +
        '<p style="font-size:12.5px;color:var(--text-sub);margin-bottom:16px;">تحقّق من صحة المعلومات الواردة في البلاغ قبل اتخاذ القرار النهائي</p>' +
        '<div class="review-grid">' +
          '<div>' +
            '<div class="card" style="margin-bottom:14px;">' +
              '<h3 style="margin-bottom:12px;">اتخاذ قرار</h3>' +
              '<textarea class="decision-textarea" id="decisionNote" placeholder="أضف ملاحظة للقبول أو الرفض..."></textarea>' +
              '<div class="decision-actions">' +
                '<button class="btn btn-primary" id="btnApprove">✅ قبول البلاغ وتحديث الحالة</button>' +
                '<button class="btn btn-outline" id="btnReject" style="border-color:#f3b9b9;color:#b02a2a;">✖ رفض البلاغ</button>' +
                '<button class="btn btn-outline" id="btnInfo">✉ طلب معلومات إضافية</button>' +
                '<button class="btn" id="btnEscalate" style="background:#1f2328;color:#fff;">⇪ تحويل للأدمن</button>' +
              '</div>' +
            '</div>' +
            '<div class="card">' +
              '<h3 style="margin-bottom:10px;">الحالة الحالية للخدمة</h3>' +
              '<div class="status-pill-lg" style="color:' + currentStatusColor + ';"><span class="legend-dot" style="background:' + currentStatusColor + '"></span> ' + currentStatusLabel + '</div>' +
              '<p style="font-size:12.5px;color:var(--text-sub);margin-top:6px;">' + report.serviceName + '</p>' +
            '</div>' +
          '</div>' +

          '<div>' +
            '<div class="card" style="margin-bottom:14px;">' +
              '<div class="card-head"><h3>تفاصيل البلاغ</h3>' + AdminUI.statusBadge(report.status, report.statusLabel) + '</div>' +
              '<div class="detail-row"><span>نوع البلاغ</span><span>' + report.issueLabel + '</span></div>' +
              '<div class="detail-row"><span>رقم البلاغ</span><span>#' + report.id + '</span></div>' +
              '<div class="detail-row"><span>تاريخ الإرسال</span><span>' + WinDB.fmtDate(report.submittedAt) + ' — ' + WinDB.timeAgo(report.submittedAt) + '</span></div>' +
              '<div class="detail-row"><span>الأولوية</span><span>' + AdminUI.priorityBadge(report.priority, report.priorityLabel) + '</span></div>' +
              '<div class="detail-row"><span>المُبلّغ</span><span>' + report.submittedBy + (report.submittedByPhone ? ' — ' + report.submittedByPhone : '') + '</span></div>' +
              '<p style="font-size:13px;margin-top:10px;background:var(--bg-muted);padding:12px;border-radius:10px;">' + report.description + '</p>' +
              (report.photos && report.photos.length ? '<div class="photo-strip">' + report.photos.map(function (p) { return '<img src="' + p + '">'; }).join('') + '</div>' : '') +
            '</div>' +

            '<div class="card" style="margin-bottom:14px;">' +
              '<h3 style="margin-bottom:10px;">الخدمة المرتبطة</h3>' +
              '<div class="detail-row"><span>الاسم</span><span>' + report.serviceName + '</span></div>' +
              '<div class="detail-row"><span>التصنيف</span><span>' + (AdminUI.CATEGORY_LABELS[report.category] || report.category) + '</span></div>' +
              '<div class="detail-row"><span>المحافظة / المنطقة</span><span>' + report.gov + (report.city ? ' - ' + report.city : '') + '</span></div>' +
            '</div>' +

            '<div class="card">' +
              '<h3 style="margin-bottom:10px;">سجل الحالة</h3>' +
              '<div class="timeline">' + report.history.map(function (h) {
                return '<div class="t-item"><span class="t-dot"></span><div><div class="t-txt">' + (h.note || h.action) + ' — <b>' + h.by + '</b></div><div class="t-time">' + WinDB.timeAgo(h.at) + '</div></div></div>';
              }).join('') + '</div>' +
            '</div>' +
          '</div>' +
        '</div>';

      function decide(status, defaultNote) {
        var note = document.getElementById('decisionNote').value.trim() || defaultNote;
        WinDB.updateIssueReportStatus(report.id, status, note, WinDB.adminCurrentUser().name);
        AdminUI.showToast('تم تحديث حالة البلاغ إلى: ' + (WinDB.STATUS_LABELS_MAP[status]), 'success');
        setTimeout(function () { window.location.href = 'reports.html'; }, 900);
      }
      document.getElementById('btnApprove').addEventListener('click', function () { decide('approved', 'تم قبول البلاغ والتحقق منه.'); });
      document.getElementById('btnReject').addEventListener('click', function () { decide('rejected', 'تم رفض البلاغ لعدم كفاية الأدلة.'); });
      document.getElementById('btnInfo').addEventListener('click', function () { decide('needs_info', 'بحاجة لمعلومات إضافية من المُبلّغ.'); });
      document.getElementById('btnEscalate').addEventListener('click', function () { decide('escalated', 'تم تحويل البلاغ للأدمن للمراجعة النهائية.'); });
    }
  }
</script>
</body>
</html>
